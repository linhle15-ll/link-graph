name: Server CI

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
