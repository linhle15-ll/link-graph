name: Client CI

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
